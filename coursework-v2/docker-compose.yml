services:
  postgres-szi-v2:
    image: postgres:16
    container_name: szi-postgres-v2
    environment:
      POSTGRES_DB: szi_registry
      POSTGRES_USER: szi_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-password}
    ports:
      - "5433:5432"
    volumes:
      - coursework_v2_pg_data:/var/lib/postgresql/data

volumes:
  coursework_v2_pg_data:
