services:
  postgres-szi:
    image: postgres:16
    container_name: szi-postgres
    environment:
      POSTGRES_DB: szi_registry
      POSTGRES_USER: szi_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
